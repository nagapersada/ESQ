                                <p class="text-amber-200 font-serif">🗣️ Hamba: "Segala puji bagi Allah Tuhan semesta alam."</p>
                                <p class="text-gold-400 font-bold mt-1">✨ Allah menjawab: "Hamba-Ku telah memuji-Ku."</p>
                            </div>
                            <div class="p-3 glass-card rounded-xl cursor-pointer hover:border-gold-400" onclick="openModal('Ayat 2', 'Hamba: Ar-Rahmanir-Rahim\nAllah: Hambaku telah menyanjung-Ku.')">
                                <p class="text-amber-200 font-serif">🗣️ Hamba: "Maha Pengasih lagi Maha Penyayang."</p>
                                <p class="text-gold-400 font-bold mt-1">✨ Allah menjawab: "Hamba-Ku telah menyanjung-Ku."</p>
                            </div>
                            <div class="p-3 glass-card rounded-xl cursor-pointer hover:border-gold-400" onclick="openModal('Ayat 3', 'Hamba: Maliki Yaumid-Din\nAllah: Hambaku telah memuliakan-Ku.')">
                                <p class="text-amber-200 font-serif">🗣️ Hamba: "Raja yang menguasai hari pembalasan."</p>
                                <p class="text-gold-400 font-bold mt-1">✨ Allah menjawab: "Hamba-Ku telah memuliakan-Ku."</p>
                            </div>
                            <div class="p-3 glass-card-gold rounded-xl cursor-pointer hover:border-gold-400" onclick="openModal('Ayat 4', 'Hamba: Iyyaaka Na\'budu wa Iyyaaka Nasta\'in\nAllah: Ayat ini antara Aku dan hamba-Ku setengah-setengah dan hamba-Ku berhak atas apa yang ia minta.')">
                                <p class="text-amber-200 font-serif">🗣️ Hamba: "Hanya kepada Engkaulah kami menyembah dan hanya kepada Engkaulah kami mohon pertolongan."</p>
                                <p class="text-amber-300 font-bold mt-1">✨ Allah menjawab: "Ayat ini antara Aku dan hamba-Ku setengah-setengah dan hamba-Ku berhak atas apa yang ia minta."</p>
                            </div>
                            <div class="p-3 glass-card rounded-xl cursor-pointer hover:border-gold-400" onclick="openModal('Ayat 5', 'Hamba: Ihdinash-Shiirathal-Mustaqiim...\nAllah: Itu semua untuk hamba-Ku, dan hamba-Ku berhak atas apa yang ia minta.')">
                                <p class="text-amber-200 font-serif">🗣️ Hamba: "Tunjukilah aku ke jalan yang lurus, jalan orang-orang yang telah Engkau beri nikmat..."</p>
                                <p class="text-gold-400 font-bold mt-1">✨ Allah menjawab: "Itu semua untuk hamba-Ku, dan hamba-Ku berhak atas apa yang ia minta."</p>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                id: 32,
                title: "Sayyidina Umar Bin Khattab R.A & Penutup",
                category: "Penutup",
                render: () => `
                    <div class="h-full flex flex-col justify-center items-center text-center px-4 max-w-3xl mx-auto space-y-6">
                        <i class="fa-solid fa-scroll text-4xl text-gold-400"></i>
                        <div class="glass-card-gold p-6 rounded-2xl border-gold-500/50 space-y-3 cursor-pointer" onclick="openModal('Sayyidina Umar Bin Khattab R.A', 'Hatiku telah melihat Tuhanku karena hijab (tirai) telah terangkat oleh taqwa. Barangsiapa yang telah terangkat hijab antara dirinya dan Allah, maka menjadi jelaslah di dalam hatinya akan gambaran kerajaan bumi dan langit.')">
                            <h2 class="text-fluid-subtitle font-serif italic text-gold-200">
                                "Hatiku telah melihat Tuhanku karena hijab (tirai) telah terangkat oleh taqwa..."
                            </h2>
                            <p class="text-xs font-bold text-gold-400">— Sayyidina Umar Bin Khattab R.A (Klik untuk Detail)</p>
                        </div>
                        <div class="space-y-2">
                            <h3 class="text-fluid-title font-bold text-gold-300">Terima Kasih</h3>
                            <p class="text-xs sm:text-sm text-slate-300">
                                Terima kasih atas waktu Anda telah mengenal / memanfaatkan untuk satu hal kecil tapi buat hal yang paling besar & bermanfaat.<br><span class="text-gold-400 font-bold">Salam ESQ,</span>
                            </p>
                        </div>
                        <button onclick="goToSlide(1)" class="px-6 py-2.5 rounded-full bg-gradient-to-r from-gold-500 to-amber-300 text-navy-950 font-bold text-xs sm:text-sm hover:scale-105 transition shadow-lg">
                            <i class="fa-solid fa-rotate-left mr-2"></i>Kembali ke Cover Awal
                        </button>
                    </div>
                `
            }
        ];

        let currentSlideIndex = 0;
        let autoPlayTimer = null;
        let isAudioPlaying = false;
        let audioContext = null;
        let oscillator = null;

        window.onload = () => {
            renderCurrentSlide();
            populateIndexModal();
            setupKeyboardNav();
        };

        function renderCurrentSlide() {
            const slide = slidesData[currentSlideIndex];
            const slideContent = document.getElementById('slideContent');
            
            slideContent.innerHTML = `
                <div class="slide-container opacity-0 transform translate-y-2 h-full flex flex-col justify-between" id="activeSlideInner">
                    ${slide.render()}
                </div>
            `;

            setTimeout(() => {
                const inner = document.getElementById('activeSlideInner');
                if (inner) {
                    inner.classList.remove('opacity-0', 'translate-y-2');
                    inner.classList.add('opacity-100', 'translate-y-0');
                }
            }, 30);

            document.getElementById('slideIndicator').innerText = `Slide ${slide.id} / ${slidesData.length}`;
            document.getElementById('slideTitleMini').innerText = `${slide.id}. ${slide.title}`;
            document.getElementById('progressRange').value = slide.id;

            document.getElementById('prevBtn').disabled = (currentSlideIndex === 0);
            document.getElementById('nextBtn').disabled = (currentSlideIndex === slidesData.length - 1);
        }

        function nextSlide() {
            if (currentSlideIndex < slidesData.length - 1) {
                currentSlideIndex++;
                renderCurrentSlide();
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderCurrentSlide();
            }
        }

        function goToSlide(slideId) {
            currentSlideIndex = slideId - 1;
            renderCurrentSlide();
            closeIndexModal();
            closeSearchModal();
        }

        function setupKeyboardNav() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'Space') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft') {
                    prevSlide();
                }
            });
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function toggleAutoPlay() {
            const playIcon = document.getElementById('playIcon');
            const playStatus = document.getElementById('playStatus');
            const autoPlayBtn = document.getElementById('autoPlayBtn');

            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
                playIcon.className = "fa-solid fa-play";
                playStatus.innerText = "Auto";
                autoPlayBtn.classList.remove('border-gold-500', 'text-gold-400');
            } else {
                playIcon.className = "fa-solid fa-pause text-gold-400";
                playStatus.innerText = "Pause";
                autoPlayBtn.classList.add('border-gold-500', 'text-gold-400');
                
                autoPlayTimer = setInterval(() => {
                    if (currentSlideIndex < slidesData.length - 1) {
                        nextSlide();
                    } else {
                        goToSlide(1);
                    }
                }, 7000);
            }
        }

        function toggleAudio() {
            const audioIcon = document.getElementById('audioIcon');
            const audioStatus = document.getElementById('audioStatus');
            const audioBtn = document.getElementById('audioBtn');

            if (isAudioPlaying) {
                if (oscillator) {
                    oscillator.stop();
                    oscillator.disconnect();
                }
                isAudioPlaying = false;
                audioIcon.className = "fa-solid fa-volume-xmark";
                audioStatus.innerText = "Sound Off";
                audioBtn.classList.remove('border-gold-500', 'text-gold-400');
            } else {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(108, audioContext.currentTime); 
                    gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.start();
                    isAudioPlaying = true;

                    audioIcon.className = "fa-solid fa-volume-high text-gold-400";
                    audioStatus.innerText = "Sound On";
                    audioBtn.classList.add('border-gold-500', 'text-gold-400');
                } catch (e) {
                    console.log("Audio not supported");
                }
            }
        }

        function populateIndexModal() {
            const indexGrid = document.getElementById('indexGrid');
            indexGrid.innerHTML = slidesData.map(s => `
                <button onclick="goToSlide(${s.id})" class="p-3 bg-navy-950/80 hover:bg-gold-500/20 border border-gold-500/20 hover:border-gold-400 rounded-xl text-left transition flex items-start space-x-2.5">
                    <span class="w-6 h-6 rounded-full bg-gold-500/20 text-gold-400 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${s.id}</span>
                    <div class="truncate">
                        <p class="text-xs font-semibold text-gold-300 truncate">${s.title}</p>
                        <p class="text-[10px] text-slate-400">${s.category}</p>
                    </div>
                </button>
            `).join('');
        }

        function openIndexModal() {
            document.getElementById('indexModal').classList.remove('hidden');
        }

        function closeIndexModal() {
            document.getElementById('indexModal').classList.add('hidden');
        }

        function openSearchModal() {
            document.getElementById('searchModal').classList.remove('hidden');
            document.getElementById('searchInput').focus();
            filterSlides();
        }

        function closeSearchModal() {
            document.getElementById('searchModal').classList.add('hidden');
        }

        function filterSlides() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const searchResults = document.getElementById('searchResults');

            const filtered = slidesData.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.category.toLowerCase().includes(query) ||
                s.id.toString() === query
            );

            if (filtered.length === 0) {
                searchResults.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Tidak ada slide yang sesuai dengan pencarian "${query}".</p>`;
                return;
            }

            searchResults.innerHTML = filtered.map(s => `
                <div onclick="goToSlide(${s.id})" class="p-3 bg-navy-950 hover:bg-gold-500/20 border border-gold-500/20 rounded-xl cursor-pointer transition flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-gold-300">Slide ${s.id}: ${s.title}</p>
                        <p class="text-[10px] text-slate-400">Kategori: ${s.category}</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gold-400"></i>
                </div>
            `).join('');
        }

        // POP-UP MODAL CONTROLLER
        function openModal(title, description) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDescription').innerText = description;
            document.getElementById('interactiveModal').classList.remove('hidden');
        }

        function closeInteractiveModal() {
            document.getElementById('interactiveModal').classList.add('hidden');
        }
    </script>
</body>
</html>
