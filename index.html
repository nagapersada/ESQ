        let currentSlideIndex = 0;
        let autoPlayTimer = null;
        let isAudioPlaying = false;
        let audioContext = null;
        let oscillator = null;

        window.onload = () => {
            renderCurrentSlide();
            populateIndexModal();
            setupKeyboardNav();
        };

        function renderCurrentSlide() {
            const slide = slidesData[currentSlideIndex];
            const slideContent = document.getElementById('slideContent');
            
            slideContent.innerHTML = `
                <div class="slide-container opacity-0 transform translate-y-2 h-full flex flex-col justify-between" id="activeSlideInner">
                    ${slide.render()}
                </div>
            `;

            setTimeout(() => {
                const inner = document.getElementById('activeSlideInner');
                if (inner) {
                    inner.classList.remove('opacity-0', 'translate-y-2');
                    inner.classList.add('opacity-100', 'translate-y-0');
                }
            }, 30);

            document.getElementById('slideIndicator').innerText = `Slide ${slide.id} / ${slidesData.length}`;
            document.getElementById('slideTitleMini').innerText = `${slide.id}. ${slide.title}`;
            document.getElementById('progressRange').value = slide.id;

            document.getElementById('prevBtn').disabled = (currentSlideIndex === 0);
            document.getElementById('nextBtn').disabled = (currentSlideIndex === slidesData.length - 1);
        }

        function nextSlide() {
            if (currentSlideIndex < slidesData.length - 1) {
                currentSlideIndex++;
                renderCurrentSlide();
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderCurrentSlide();
            }
        }

        function goToSlide(slideId) {
            currentSlideIndex = slideId - 1;
            renderCurrentSlide();
            closeIndexModal();
            closeSearchModal();
        }

        function setupKeyboardNav() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'Space') {
                    nextSlide();
                } else if (e.key === 'ArrowLeft') {
                    prevSlide();
                }
            });
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function toggleAutoPlay() {
            const playIcon = document.getElementById('playIcon');
            const playStatus = document.getElementById('playStatus');
            const autoPlayBtn = document.getElementById('autoPlayBtn');

            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
                playIcon.className = "fa-solid fa-play";
                playStatus.innerText = "Auto";
                autoPlayBtn.classList.remove('border-gold-500', 'text-gold-400');
            } else {
                playIcon.className = "fa-solid fa-pause text-gold-400";
                playStatus.innerText = "Pause";
                autoPlayBtn.classList.add('border-gold-500', 'text-gold-400');
                
                autoPlayTimer = setInterval(() => {
                    if (currentSlideIndex < slidesData.length - 1) {
                        nextSlide();
                    } else {
                        goToSlide(1);
                    }
                }, 7000);
            }
        }

        function toggleAudio() {
            const audioIcon = document.getElementById('audioIcon');
            const audioStatus = document.getElementById('audioStatus');
            const audioBtn = document.getElementById('audioBtn');

            if (isAudioPlaying) {
                if (oscillator) {
                    oscillator.stop();
                    oscillator.disconnect();
                }
                isAudioPlaying = false;
                audioIcon.className = "fa-solid fa-volume-xmark";
                audioStatus.innerText = "Sound Off";
                audioBtn.classList.remove('border-gold-500', 'text-gold-400');
            } else {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(108, audioContext.currentTime); 
                    gainNode.gain.setValueAtTime(0.03, audioContext.currentTime);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.start();
                    isAudioPlaying = true;

                    audioIcon.className = "fa-solid fa-volume-high text-gold-400";
                    audioStatus.innerText = "Sound On";
                    audioBtn.classList.add('border-gold-500', 'text-gold-400');
                } catch (e) {
                    console.log("Audio not supported");
                }
            }
        }

        function populateIndexModal() {
            const indexGrid = document.getElementById('indexGrid');
            indexGrid.innerHTML = slidesData.map(s => `
                <button onclick="goToSlide(${s.id})" class="p-3 bg-navy-950/80 hover:bg-gold-500/20 border border-gold-500/20 hover:border-gold-400 rounded-xl text-left transition flex items-start space-x-2.5">
                    <span class="w-6 h-6 rounded-full bg-gold-500/20 text-gold-400 text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">${s.id}</span>

                        <p class="text-xs font-semibold text-gold-300 truncate">${s.title}</p>
                        <p class="text-[10px] text-slate-400">${s.category}</p>
                    </div>
                </button>
            `).join('');
        }

        function openIndexModal() {
            document.getElementById('indexModal').classList.remove('hidden');
        }

        function closeIndexModal() {
            document.getElementById('indexModal').classList.add('hidden');
        }

        function openSearchModal() {
            document.getElementById('searchModal').classList.remove('hidden');
            document.getElementById('searchInput').focus();
            filterSlides();
        }

        function closeSearchModal() {
            document.getElementById('searchModal').classList.add('hidden');
        }

        function filterSlides() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const searchResults = document.getElementById('searchResults');

            const filtered = slidesData.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.category.toLowerCase().includes(query) ||
                s.id.toString() === query
            );

            if (filtered.length === 0) {
                searchResults.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Tidak ada slide yang sesuai dengan pencarian "${query}".</p>`;
                return;
            }

            searchResults.innerHTML = filtered.map(s => `
                <div onclick="goToSlide(${s.id})" class="p-3 bg-navy-950 hover:bg-gold-500/20 border border-gold-500/20 rounded-xl cursor-pointer transition flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-gold-300">Slide ${s.id}: ${s.title}</p>
                        <p class="text-[10px] text-slate-400">Kategori: ${s.category}</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gold-400"></i>
                </div>
            `).join('');
        }

        function showEsqInfo(title, desc) {
            document.getElementById('esqInfoTitle').innerText = title;
            document.getElementById('esqInfoDesc').innerText = desc;
        }

        function showBelenggu(num, title, desc) {
            document.getElementById('belengguInfo').innerHTML = `
                <span class="font-bold text-gold-400">Belenggu ${num}: ${title}</span> — <span class="text-slate-300">${desc}</span>
            `;
        }
    </script>
